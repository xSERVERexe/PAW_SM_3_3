<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>3_3</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <h2>Wyszukiwarka GIF-ów z GIPHY</h2>

        <form id="giphySearchForm">
            <input
                type="password"
                id="apiKeyInput"
                placeholder="Wklej swój klucz API..."
                required
            />
            <input
                type="text"
                id="searchInput"
                placeholder="Szukana fraza (np. cat)..."
                required
            />
            <button type="submit">Szukaj</button>
        </form>

        <div id="messageContainer"></div>

        <div id="gifContainer"></div>
    </body>
</html>
